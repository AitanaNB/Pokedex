<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pokedle - Pokédex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .game-container {
            max-width: 800px;
            margin: 40px auto;
            text-align: center;
        }

        .mystery-box {
            width: 180px;
            height: 180px;
            margin: 20px auto;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
        }

        .guess-input {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 2px solid #667eea;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin: 10px;
        }

        .btn-guess {
            background-color: #4ecdc4;
            color: white;
        }

        .btn-surrender {
            background-color: #ff6b6b;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th, td {
            padding: 8px;
            border: 1px solid #ccc;
            text-align: center;
        }

        td.ok {
            background-color: #2ecc71;
            color: white;
        }

        td.fail {
            background-color: #e74c3c;
            color: white;
        }

        /* Popup */
        .popup {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .popup-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 300px;
        }

        .popup-content button {
            margin-top: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>🎮 Pokedle</h1>
    <a href="{{ url_for('auth.dashboard') }}">← Dashboard</a>
</header>

<div class="game-container">
    <div class="mystery-box">❓</div>

    <input
        type="text"
        id="guessInput"
        class="guess-input"
        placeholder="Escribe el nombre del Pokémon..."
    >

    <div>
        <button class="btn btn-guess" onclick="sendGuess()">Adivinar</button>
        <button class="btn btn-surrender" onclick="surrender()">Rendirse</button>
    </div>

    <!-- TABLA DE INTENTOS -->
    <table id="results">
        <thead>
            <tr>
                <th>Especie</th>
                <th>Ataque</th>
                <th>Ataque Esp</th>
                <th>Def</th>
                <th>Def Esp</th>
                <th>Vel</th>
                <th>Vida</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- POPUP FINAL -->
<div id="overlay" class="popup">
    <div class="popup-content">
        <p id="popupText"></p>
        <button class="btn btn-guess" onclick="startGame()">Volver a jugar</button>
        <button class="btn btn-surrender" onclick="location.href='{{ url_for('auth.dashboard') }}'">
            Menú
        </button>
    </div>
</div>

<script src="{{ url_for('static', filename='pokedle.js') }}"></script>
</body>
</html>
